<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para o Meu Amor ❤️</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #fff0f3;
            color: #5c001e;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 20px auto;
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.2);
        }
        h1 { color: #ff4d6d; font-size: 2.2em; }
        .contador-box {
            background-color: #ffeff2;
            padding: 15px;
            border-radius: 15px;
            margin: 25px 0;
            border: 1px dashed #ff4d6d;
        }
        .dias-numero {
            font-size: 2.5em;
            font-weight: bold;
            color: #ff4d6d;
            display: block;
        }
        .galeria {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .foto {
            width: 100%;
            border-radius: 20px;
            border: 5px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .heart { color: #ff4d6d; font-size: 1.8em; animation: pulse 1.5s infinite; display: inline-block; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Para a pessoa da minha vida ❤️</h1>
        <p>Cada momento ao seu lado é um presente que eu guardo com todo carinho.</p>
        <div class="contador-box">
            <span>Estamos juntos há:</span>
            <span class="dias-numero" id="dias">...</span>
            <span>dias incríveis!</span>
        </div>
        <div class="galeria">
            <img src="foto.png" class="foto">
            <img src="foto2.png" class="foto">
            <img src="foto3.jpg" class="foto">
        </div>
        <p><strong>"Você é a minha melhor escolha."</strong></p>
        <div style="margin-top: 30px;">
            Com todo amor, <br> <strong>Marcos</strong> <br>
            <span class="heart">❤</span>
        </div>
    </div>
    <script>
        const dataInicio = new Date(2024, 10, 3);
        const hoje = new Date();
        const diff = Math.abs(hoje - dataInicio);
        const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
        document.getElementById("dias").innerHTML = dias;
    </script>
</body>
</html>
