<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qui Amor</title>
</head>
<body>
    <h1>Welcome to Qui Amor</h1>
    <button onclick="displayMessage()">Click Me for a Special Message</button>
    <div id="message" style="display:none;">
        <p>Your love is the music of my heart!</p>
    </div>
    <audio controls autoplay hidden>
        <source src="path_to_your_music.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <h2>Romantic Messages</h2>
    <ul>
        <li>You make my world brighter!</li>
        <li>I cherish every moment with you!</li>
        <li>Your smile is my sunshine!</li>
    </ul>
    <h2>Things I Love About You</h2>
    <ul>
        <li>Your kindness</li>
        <li>Your sense of humor</li>
        <li>Your intelligence</li>
        <li>Your passion for life</li>
    </ul>
    <script type="text/javascript">
        function displayMessage() {
            document.getElementById('message').style.display = 'block';
        }
    </script>
</body>
</html>
