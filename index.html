<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para o Meu Amor ❤️</title>

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff0f3;
            color: #5c001e;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 20px auto;
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.2);
        }

        }
        .dias-numero {

            font-weight: bold;
            color: #ff4d6d;
            display: block;
        }

            display: flex;
            flex-direction: column;
            gap: 30px; /* Aumentado para dar espaço entre os blocos */

        }
        .foto {
            width: 100%;
            border-radius: 20px;

        }

        .legenda-foto {

            font-style: italic;
            line-height: 1.4;
        }

            color: white;

            font-weight: bold;

            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
        }
