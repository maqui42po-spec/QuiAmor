<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para a pessoa da minha vida ❤️</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f2f2f2; }
        h1 { color: #c71585; }
        #contador { font-size: 2em; color: #ff4500; }
        .galeria { display: flex; justify-content: center; margin-top: 20px; }
        .galeria img { margin: 10px; max-width: 200px; border-radius: 10px; }
        footer { margin-top: 30px; font-size: 1.2em; color: #555; }
    </style>
</head>
<body>
    <h1>Para a pessoa da minha vida ❤️</h1>
    <div id="contador">
        Contador de dias: <span id="dias">0</span>
    </div>
    <div class="galeria">
        <img src="foto.png" alt="Foto 1">
        <img src="foto2.png" alt="Foto 2">
        <img src="foto3.jpg" alt="Foto 3">
    </div>
    <p>Vida, você é o meu sol. Cada dia que passa, meu amor por você só cresce.</p>
    <footer>
        Com todo o meu amor, Marcos ❤
    </footer>
    <script>
        const date1 = new Date('2022-03-08'); // Data inicial
        const date2 = new Date(); // Data atual
        const timeDiff = Math.abs(date2 - date1);
        const diffDays = Math.ceil(timeDiff / (1000 * 3600 * 24));
        document.getElementById('dias').innerText = diffDays;
    </script>
</body>
</html>
